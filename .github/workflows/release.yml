name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 创建发布
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 运行测试
      run: npm test

    - name: 构建项目
      run: npm run build

    - name: 生成变更日志
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: 创建 GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body: |
          ## 🎉 发布 ${{ github.ref_name }}

          ### 📝 变更内容
          ${{ steps.changelog.outputs.CHANGELOG }}

          ### 📥 安装
          ```bash
          npm install strategy-manager@${{ github.ref_name }}
          ```

          ### 🔗 链接
          - [完整变更日志](https://github.com/starlink-awaken/StrategyManager/compare/${{ github.ref_name }})
          - [文档](https://github.com/starlink-awaken/StrategyManager/tree/main#readme)
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        files: |
          dist/**/*
          package*.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 发布到 npm
      if: ${{ !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
