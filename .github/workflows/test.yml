name: Test Coverage & CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun-version: [latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install

      - name: Run type check
        run: bun run type-check

      - name: Run unit tests - PathManager
        run: bun test tests/unit/PathManager.test.ts --reporter=junit --reporter-outfile test-results-pathmanager.xml
        continue-on-error: false

      - name: Run unit tests - Validator
        run: bun test tests/unit/Validator.test.ts --reporter=junit --reporter-outfile test-results-validator.xml
        continue-on-error: false

      - name: Run unit tests - Recommender
        run: bun test tests/unit/Recommender.test.ts --reporter=junit --reporter-outfile test-results-recommender.xml
        continue-on-error: false

      - name: Run all tests
        run: bun test
        continue-on-error: false

      - name: Generate coverage report
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && runner.os == 'Linux'
        with:
          files: test-results-*.xml
          check_name: Test Results (${{ matrix.os }})

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run type check strict
        run: bun run type-check

      - name: Check for console.log in production code
        run: |
          ! grep -r "console\.log" Tools/ --include="*.ts" \
            --exclude-dir=node_modules \
            --exclude="*.test.ts" \
            || echo "Warning: Found console.log in production code"
        continue-on-error: true
